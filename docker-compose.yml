services:
  tor:
    image: dperson/torproxy:latest
    container_name: tg_tor_proxy
    restart: always
    environment:
      - TOR_PORT=9050
      - HTTP_PROXY=8118

  bot:
    build: .
    container_name: tg_invoice_bot
    restart: always
    depends_on:
      - tor
    env_file:
      - .env
    volumes:
      - ./data:/app/data